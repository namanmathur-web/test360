<title>Vedantu Self Study Platform</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap">
<style>
/* Concept: Vedantu's own result-page look (violet card, orange ScoreBooster panel) wrapped around a YouTube-style entry. */
:root{
  --bg:#FBF4F0; --glow1:#FFE0D3; --glow2:#EADFFF; --surface:#FFFDF8; --surface2:#F6EFF8; --ink:#01202B; --muted:#5E6B73; --line:#EDD8C9;
  --brand:#5814D6; --brand2:#6825E5; --brand-ink:#ffffff; --brand-soft:#F1ECFF;
  --orange:#F23D09; --borange:#FF693D; --orange-soft:#FFF0E9;
  --good:#0A8F62; --good-soft:#EAF9F3; --bad:#D62828; --bad-soft:#FFF0EF;
  --yt-bg:#ffffff; --yt-ink:#0f0f0f; --yt-chip:#f2f2f2; --yt-sub:#606060;
  --nav:#FFFDF8; --nav-ink:#01202B; --navline:#EDD8C9;
  --mesh:radial-gradient(70% 90% at 0% 100%,#424AFB 0%,transparent 60%),radial-gradient(60% 80% at 100% 90%,#FF693D 0%,transparent 62%),radial-gradient(55% 60% at 62% 0%,#EC6A8C 0%,transparent 65%),linear-gradient(115deg,#5814D6,#A63DAE 55%,#F5685A);
  --font:"Poppins","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0D10; --glow1:#2A1710; --glow2:#1E1736; --surface:#18171C; --surface2:#221F27; --ink:#F3ECE6; --muted:#AAA098; --line:#332A34;
    --brand:#B99DFF; --brand2:#B99DFF; --brand-ink:#1a0b3d; --brand-soft:#29223D;
    --orange:#FF8A5A; --borange:#FF7A4D; --orange-soft:#2D1E18;
    --good:#4FD9A8; --good-soft:#10372C; --bad:#FF7A7A; --bad-soft:#381E1F;
    --yt-bg:#0f0f0f; --yt-ink:#f1f1f1; --yt-chip:#272727; --yt-sub:#aaaaaa;
    --nav:#18171C; --nav-ink:#F3ECE6; --navline:#332A34; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0D10; --glow1:#2A1710; --glow2:#1E1736; --surface:#18171C; --surface2:#221F27; --ink:#F3ECE6; --muted:#AAA098; --line:#332A34;
  --brand:#B99DFF; --brand2:#B99DFF; --brand-ink:#1a0b3d; --brand-soft:#29223D;
  --orange:#FF8A5A; --borange:#FF7A4D; --orange-soft:#2D1E18;
  --good:#4FD9A8; --good-soft:#10372C; --bad:#FF7A7A; --bad-soft:#381E1F;
  --yt-bg:#0f0f0f; --yt-ink:#f1f1f1; --yt-chip:#272727; --yt-sub:#aaaaaa;
  --nav:#18171C; --nav-ink:#F3ECE6; --navline:#332A34; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(60% 45% at 100% 0%,var(--glow1) 0,transparent 70%),radial-gradient(55% 40% at 0% 8%,var(--glow2) 0,transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;padding-inline:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{max-width:1040px;margin:0 auto;padding-block:0 56px}
.narrow{max-width:560px;margin-inline:auto}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;letter-spacing:-.01em}
h1{font-size:24px;color:var(--ink);line-height:1.2;font-weight:700;text-wrap:balance}
h2{font-size:18px;line-height:1.25;font-weight:700;text-wrap:balance}
h3{font-size:15px;font-weight:600}
p{margin:0 0 8px}
svg{display:block}

/* demo navigator */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:-16px;padding:8px 16px;background:color-mix(in srgb,var(--nav) 92%,transparent);backdrop-filter:blur(10px);color:var(--nav-ink);border-bottom:1px solid var(--navline);display:flex;align-items:center;gap:10px}
.brandmk{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.01em}.brandmk svg{width:28px;height:28px;color:var(--orange)}.brandmk em{font-style:normal;background:linear-gradient(90deg,var(--orange),var(--brand));-webkit-background-clip:text;background-clip:text;color:transparent}.theme{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--navline);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}.theme svg{width:18px;height:18px}
.steps{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;border:1.5px solid var(--navline);background:transparent;color:var(--nav-ink);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:500;white-space:nowrap}
.step.cur{background:linear-gradient(135deg,var(--brand2),var(--brand));color:var(--brand-ink);border-color:transparent;font-weight:600}
.step[disabled]{opacity:.4;cursor:default}
.restart{flex:0 0 auto;background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.page{padding-block:18px 8px}
@media(max-width:620px){.nav{flex-wrap:wrap;row-gap:6px}.brandmk{margin-right:auto}.steps{order:5;flex:1 1 100%}.ytSide{display:none}.ytTop{font-size:13px;padding:10px 12px 30px}.scene text{display:none}}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;padding:12px 18px;text-align:center}
.btn.primary{background:linear-gradient(135deg,#6825E5,#5814D6);color:#fff;border-color:transparent;box-shadow:0 8px 20px -10px rgba(88,20,214,.8)}
:root[data-theme="dark"] .btn.primary{background:linear-gradient(135deg,#B99DFF,#9B7BFF);color:#1a0b3d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:linear-gradient(135deg,#B99DFF,#9B7BFF);color:#1a0b3d}}
.btn.orange{background:linear-gradient(135deg,#FF693D,#F23D09);color:#fff;border-color:transparent;box-shadow:0 8px 20px -10px rgba(242,61,9,.8)}
.btn.quiet{background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--orange);color:var(--orange);border-radius:5px;padding:0 6px;vertical-align:middle}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}

/* ---------- YouTube ---------- */
.yt{background:var(--yt-bg);color:var(--yt-ink);border-radius:16px;padding:0 0 18px;overflow:hidden;border:1px solid var(--line)}
.ytplayer{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;color:#fff;user-select:none}
.ytplayer .scene{position:absolute;inset:0;width:100%;height:100%}
.ytTop{position:absolute;left:0;right:0;top:0;padding:14px 18px 40px;background:linear-gradient(#000000b0,transparent);font-size:clamp(14px,2.4vw,20px);font-weight:600;transition:opacity .2s}
.playing .ytTop{opacity:0}
.bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:48px;border-radius:14px;border:0;background:#f00;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.bigplay svg{width:28px;height:28px}
.playing .bigplay{display:none}
.ytSide{position:absolute;right:14px;bottom:62px;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border-radius:999px;padding:4px 8px}
.ytSide button{background:none;border:0;color:#fff;width:36px;height:36px;display:flex;align-items:center;justify-content:center;padding:0}
.ytSide svg,.ytCtl svg{width:22px;height:22px}
.ytBottom{position:absolute;left:0;right:0;bottom:0;padding:0 12px 6px;background:linear-gradient(transparent,#000000a0)}
.ytProg{position:relative;height:16px;cursor:pointer;display:flex;align-items:center}
.ytProg .track{position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.3);border-radius:2px}
.ytProg .fill{position:absolute;left:0;height:3px;background:#f00;border-radius:2px;width:0}
.ytProg .dot{position:absolute;width:13px;height:13px;border-radius:50%;background:#f00;margin-left:-6px;left:0}
.ytCtl{display:flex;align-items:center;gap:6px;height:40px}
.ytCtl button{background:none;border:0;color:#fff;width:34px;height:34px;display:flex;align-items:center;justify-content:center;padding:0}
.ytCtl .time{font-size:13px;margin-left:4px;font-variant-numeric:tabular-nums}
.ytCtl .sp{flex:1}
.hd{position:relative}.hd i{position:absolute;right:-4px;top:-2px;background:#f00;font-style:normal;font-size:7px;font-weight:700;border-radius:2px;padding:0 2px}
.endcard{position:absolute;inset:0;background:var(--mesh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
.endcard[hidden]{display:none}
.endcard .e1{font-size:clamp(18px,3.4vw,28px);font-weight:700;max-width:520px;line-height:1.2}
.endcard .e2{font-size:clamp(12px,1.9vw,15px);opacity:.85;max-width:420px}
.endcard .btn{width:auto;min-width:240px;max-width:90%}
.ytBody{padding:14px 16px 0}
.ytTitle{font-size:20px;font-weight:700;line-height:1.3}
.ytChan{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#7a3ee0,#f26a2e);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.ytChan .nm{font-weight:600;font-size:15px;line-height:1.2}
.ytChan .sub{font-size:12px;color:var(--yt-sub)}
.subbtn{margin-left:6px;border:0;background:var(--yt-ink);color:var(--yt-bg);font-weight:600;border-radius:999px;padding:8px 16px;font-size:14px}
.pill{display:flex;align-items:center;background:var(--yt-chip);border-radius:999px;overflow:hidden;margin-left:auto}
.pill button{background:none;border:0;display:flex;align-items:center;gap:6px;padding:8px 14px;font-size:14px;font-weight:500;color:var(--yt-ink)}
.pill button+button{border-left:1px solid color-mix(in srgb,var(--yt-ink) 20%,transparent)}
.pill svg{width:20px;height:20px}
.ytDesc{margin-top:12px;background:var(--yt-chip);border-radius:12px;padding:12px 14px;font-size:14px}
.ytDesc b{font-weight:600}
.ytlink{color:#065fd4;font-weight:500}
:root[data-theme="dark"] .ytlink{color:#3ea6ff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ytlink{color:#3ea6ff}}
.chaps{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.chaps li{display:flex;gap:12px;align-items:baseline}
.chaps .t{flex:0 0 108px;font-variant-numeric:tabular-nums}
.pinned{margin-top:14px;display:flex;gap:12px}
.pinned .av{width:36px;height:36px;font-size:13px}
.pinned .pn{font-size:12px;color:var(--yt-sub);display:flex;align-items:center;gap:6px;margin-bottom:2px}
.pinned .tx{font-size:14px}
.ctabtn{margin-top:10px;display:inline-flex;align-items:center;gap:8px;border:0;background:linear-gradient(135deg,#6825E5,#5814D6);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px}

/* ---------- test ---------- */
.tbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tbar .ti{font-size:17px;font-weight:700}
.tbar .sub{font-size:12.5px;color:var(--muted)}
.timer{display:inline-flex;align-items:center;gap:8px;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.tgrid{display:grid;gap:14px}
@media(min-width:760px){.tgrid{grid-template-columns:minmax(0,1fr) 230px;align-items:start}.tgrid .pal{grid-column:2;grid-row:1}.tgrid .qcol{grid-column:1;grid-row:1}}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.marks{display:inline-flex;gap:6px}.marks span{border-radius:6px;padding:1px 8px;font-weight:600;font-size:12px}
.marks .p{background:var(--good-soft);color:var(--good)}.marks .m{background:var(--bad-soft);color:var(--bad)}
.stem{font-size:24px;line-height:1.5;padding-block:16px 18px;overflow-x:auto}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;min-height:54px;padding:10px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-size:17px}
.opt .ol{flex:0 0 28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .ol{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.pal .dots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:10px}
@media(min-width:760px){.pal .dots{grid-template-columns:repeat(4,minmax(0,1fr))}}
.dotq{height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;padding:0}
.dotq.done{background:var(--good);border-color:var(--good);color:#fff}
.dotq.cur{box-shadow:0 0 0 2px var(--brand)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- result ---------- */
.rtitle{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:6px}
.rtitle h1{font-size:21px}
.rtitle .meta{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{background:none;border:0;padding:10px 2px;font-weight:500;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);font-weight:600;border-color:var(--ink)}
.perf{display:grid;gap:18px}
@media(min-width:860px){.perf{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.hero{position:relative;color:#fff;text-shadow:0 1px 10px rgba(30,5,70,.25);border-radius:26px;padding:26px 24px 22px;overflow:hidden;background:var(--mesh)}
.hero .hi{font-size:19px;font-weight:400;opacity:.95}
.hero .big{font-size:30px;font-weight:700;line-height:1.15;margin-top:2px}
.hero .top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.ring{position:relative;flex:0 0 138px;width:138px;height:138px}
.ring svg{width:100%;height:100%}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .k{font-size:11px;font-weight:600;letter-spacing:.08em;opacity:.8}
.ring .n{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.03em}
.ring .o{font-size:12px;opacity:.9}
.hero .note{display:inline-block;background:rgba(255,255,255,.14);border-radius:8px;padding:2px 10px;font-size:13px;margin-top:14px}
.hero .sub{font-size:12.5px;opacity:.9;margin-top:4px;max-width:260px}
.oqa{display:flex;align-items:center;gap:12px;margin-top:22px;font-size:17px;font-weight:700}
.oqa:after{content:"";flex:1;border-top:1.5px dashed rgba(255,255,255,.55)}
.oqa-in{margin-top:12px;background:rgba(255,255,255,.1);border-radius:16px;padding:14px 16px}
.oqa-h{display:flex;justify-content:space-between;align-items:flex-end}
.oqa-h .l{font-size:13px;opacity:.9}.oqa-h .v{font-size:28px;font-weight:700;line-height:1.1}
.oqa-h .v small{font-size:12px;opacity:.7;font-weight:500}
.seg{display:flex;height:9px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,.2);margin-top:8px}
.seg i{display:block;height:100%}
.leg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px;font-size:12.5px}
.leg b{display:block;font-size:17px;font-weight:700}
.leg .d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
@media(max-width:520px){.leg{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:12px}}
.meter{height:5px;border-radius:3px;background:linear-gradient(90deg,#FB3030,#FECB01,#08AD73);position:relative;margin-top:6px}
.meter i{position:absolute;top:-3px;width:3px;height:11px;background:#fff;border-radius:2px;margin-left:-1px}
.time{margin-top:12px;font-size:12.5px;opacity:.85}
.cmp{margin-top:12px;font-size:13px;color:var(--muted)}
.tb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;margin-top:10px}
.tb .nm{font-size:14px}.tb .ct{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tb .tr{grid-column:1/3;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-bottom:8px}
.tb .tr i{display:block;height:100%;border-radius:4px;background:var(--good)}
.tb .tr i.low{background:var(--orange)}

/* ScoreBooster */
.sb{border-radius:26px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.sbh{padding:20px 20px 70px;-webkit-mask:none;position:relative;color:#fff;background:var(--mesh)}
.vedlogo{display:inline-flex;align-items:stretch;border-radius:12px;overflow:hidden;transform:rotate(-2deg);box-shadow:0 4px 14px -6px rgba(0,0,0,.4)}
.vedlogo b{background:linear-gradient(135deg,#F23D09,#5814D6 70%);color:#fff;font-size:22px;font-weight:800;padding:4px 12px}
.vedlogo i{background:#fff;color:#01202B;font-size:22px;font-weight:800;font-style:italic;padding:4px 12px 4px 10px}
.sbl{display:flex;gap:12px;margin-top:16px;font-size:14.5px;line-height:1.45}
.sbl .ico{flex:0 0 26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.sbl .ico svg{width:15px;height:15px}
.sbl b{font-weight:700}
.discuss{display:inline-flex;align-items:center;gap:8px;margin:16px 0 0 38px;border:0;background:rgba(255,255,255,.28);backdrop-filter:blur(6px);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
.discuss svg{width:15px;height:15px}
.sbh:after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(transparent,var(--surface))}
.sbb{margin-top:-30px;padding:0 16px 18px;position:relative}
.act{display:flex;align-items:center;gap:12px;padding:10px 4px 14px}
.act .tg{flex:0 0 38px;height:38px}
.act .t{font-size:15px;font-weight:500;line-height:1.35}
.act .t b{color:var(--brand);font-weight:700}
.qa{border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:10px}
.qa>summary{list-style:none;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;border:0}
.qa>summary::-webkit-details-marker{display:none}
.qa .tt{font-weight:700;font-size:15px}
.qa .gain{font-size:12px;font-weight:700;background:var(--good-soft);color:var(--good);border-radius:999px;padding:2px 10px;white-space:nowrap}
.qa .chev{width:16px;height:16px;transition:transform .2s;color:var(--muted)}
.qa[open] .chev{transform:rotate(180deg)}
.qa .bd{padding:0 16px 14px;font-size:13.5px;color:var(--muted)}
.qa .bd b{color:var(--ink)}
.qi{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface2);color:var(--ink);font-size:13.5px}
.qi .tag{font-size:11px;font-weight:600;border-radius:5px;padding:0 6px;margin-left:6px}
.tag.b{background:var(--bad-soft);color:var(--bad)}.tag.s{background:var(--line);color:var(--muted)}
.qi .w{flex:0 0 auto;background:var(--brand);color:var(--brand-ink);border:0;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}
.ved{margin:0 0 10px 38px;display:flex;flex-direction:column;gap:8px}
.ved .q{align-self:flex-start;background:rgba(255,255,255,.9);color:#4a1fc4;border:0;border-radius:14px;padding:6px 12px;font-size:13px;font-weight:600;text-align:left}
.ved .a{background:rgba(255,255,255,.95);color:#1a1a2e;border-radius:14px;padding:10px 12px;font-size:13px}
.ved small{color:#fff;opacity:.9;font-size:11.5px}

/* answers tab */

/* ---------- analysis ---------- */
function lostOf(a,q){return a===null?4:(a===q.a?0:5);}
function analyse(){
  var ans=S.test.ans,c=0,w=0,s=0,score=0,topic={},total=0;
  ORDER.forEach(function(t){topic[t]={total:0,correct:0,lost:0};});
  var hiAtt=0,hiRight=0,hiMiss=[],easyMiss=[],easyTot=0,easyRight=0,hiTot=0,hiLost=0,easyLost=0;
  Q.forEach(function(q,i){
    var a=ans[i],l=lostOf(a,q),ok=a===q.a;
    topic[q.t].total++;topic[q.t].lost+=l;total+=l;
    if(a===null)s++;else if(ok){c++;score+=4;topic[q.t].correct++;}else{w++;score-=1;}
    if(q.w==="high"){hiTot++;if(a!==null)hiAtt++;if(ok)hiRight++;else{hiMiss.push({q:q,i:i,a:a,l:l});hiLost+=l;}}
    if(q.d==="easy"){easyTot++;if(ok)easyRight++;else{easyMiss.push({q:q,i:i,a:a,l:l});easyLost+=l;}}
  });
  var weak=ORDER.filter(function(t){return topic[t].lost>0;}).sort(function(x,y){return topic[y].lost-topic[x].lost;});
  var att=c+w;
  return {c:c,w:w,s:s,att:att,acc:att?Math.round(100*c/att):0,score:score,topic:topic,weak:weak,total:total,
    hiAtt:hiAtt,hiRight:hiRight,hiMiss:hiMiss,hiTot:hiTot,hiLost:hiLost,easyMiss:easyMiss,easyTot:easyTot,easyRight:easyRight,easyLost:easyLost};
}
function mmss(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),r=sec%60;return m+":"+(r<10?"0":"")+r;}

   '<div class="in"><span class="k">'+label+'</span><span class="n">'+score+'</span><span class="o">out of '+max+'</span></div></div>';
}

/* youtube */
function ytUpdate(){
  var y=S.yt;
  var f=document.getElementById("ytfill"),d=document.getElementById("ytdot"),t=document.getElementById("ytt"),e=document.getElementById("ytend"),p=document.getElementById("ytp"),pp=document.getElementById("ytpp");
  if(!f)return;
  f.style.width=(y.p*100)+"%";d.style.left=(y.p*100)+"%";t.textContent=mmss(y.p*DUR)+" / "+mmss(DUR);
  p.classList.toggle("playing",y.playing);
  pp.innerHTML=y.playing?I.pause:I.play;
  e.hidden=!(y.p>=1);
}
function startYt(){
  clearInterval(ytTimer);
  ytTimer=setInterval(function(){
    var y=S.yt;
    y.p=Math.min(1,y.p+0.0035);
    if(y.p>=1){y.playing=false;clearInterval(ytTimer);}
    ytUpdate();
  },60);
}
function ytToggle(){
  var y=S.yt;
  if(y.p>=1)y.p=0;
  y.playing=!y.playing;
  if(y.playing)startYt();else clearInterval(ytTimer);
  ytUpdate();
}

  if(key==="test"){S.test.spent=Math.min(900,Math.round((Date.now()-S.test.t0)/1000));go("result");}
  else{go("progress");}
}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b||b.disabled)return;
  var a=b.dataset.a,k=b.dataset.k,c=k?S[k]:null;
  if(shellAct(a,b,e))return;
  if(a==="go"||a==="start"){
    if(a==="start"){e.preventDefault();S.test.t0=Date.now();S.yt.playing=false;go("test");}
    else go(b.dataset.to);
  }
  else if(a==="ytplay"){ytToggle();}
  else if(a==="ytreplay"){S.yt.p=0;S.yt.playing=true;ytUpdate();startYt();}
  else if(a==="ytmute"){S.yt.muted=!S.yt.muted;b.innerHTML=S.yt.muted?I.muted:I.vol;}
  else if(a==="ytseek"){var r=b.getBoundingClientRect();S.yt.p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));ytUpdate();}
  else if(a==="pick"){c.ans[c.qi]=+b.dataset.i;render();}
  else if(a==="clear"){c.ans[c.qi]=null;render();}
  else if(a==="back"){if(c.qi>0)c.qi--;render();}
  else if(a==="jump"){c.qi=+b.dataset.q;render();}
  else if(a==="next"){if(c.qi<c.list.length-1){c.qi++;render();}else submit(k);}
  else if(a==="fill"){S.test.ans=[3,null,1,0,2,null];S.test.spent=Math.min(900,Math.round((Date.now()-S.test.t0)/1000)||412);go("result");}
  else if(a==="tab"){S.tab=b.dataset.v;render();}
  else if(a==="ved"){S.ved=!S.ved;render();}
  else if(a==="vq"){S.vq=+b.dataset.i;render();}
  else if(a==="unlock"){S.unlocked=true;S.plan=b.dataset.plan||"pack";render();window.scrollTo(0,0);}
  else if(a==="relock"){S.unlocked=false;S.plan=null;render();window.scrollTo(0,0);}
  else if(a==="sel"){S.sel=b.dataset.t;render();}
  else if(a==="watch"){S.yt.p=Math.min(.99,tsStart(b.dataset.t)/DUR);S.yt.playing=true;go("video");}
  else if(a==="answers"){S.tab="ans";go("result");}
  else if(a==="startrt"){
    var weak=analyse().weak.slice(0,4);
    S.weak=weak;S.rt={list:weak.map(function(t){return RT[t];}),ans:weak.map(function(){return null;}),qi:0};
    go("retest");
  }
  else if(a==="fillrt"){S.rt.ans=S.rt.list.map(function(q){return q.a;});go("progress");}
  else if(a==="toast"){toast(b.dataset.msg);}
  else if(a==="theme"){theme=theme==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",theme);render();}
  else if(a==="restart"){stopTimers();S=fresh();render();window.scrollTo(0,0);}
});

/* ---- revision toolkit ---- */
function vRevision(){
  var f=G.fc,t=ORDER[f.i],card=f.flip?'<span class="fl">Key idea</span><p>'+TOPICS[t].note+'</p>':'<span class="fl">Topic '+(f.i+1)+' of '+ORDER.length+'</span><p>'+TOPICS[t].n+'</p><small>What is the key idea? Tap to flip.</small>';
  return crumbs([cbtn("Home","home"),cbtn("Limits","hub"),"Revision"])+'<h1 class="xh1">Revision toolkit</h1><p class="muted" style="margin:0 0 20px">Quick cards, your saved topics and the mistakes to avoid. Built for the day before a test.</p>'+
   '<div class="xtg"><div><button class="fcard'+(f.flip?' back':'')+'" data-a="fcflip" aria-label="Flip the card">'+card+'</button><div class="nbtn" style="margin-top:16px"><button class="btn quiet" data-a="fcgo" data-d="-1">Previous</button><button class="btn primary" data-a="fcgo" data-d="1">Next card</button></div></div>'+
   '<div class="side"><div class="slips"><h2>Saved topics</h2>'+bookmarksHtml()+'</div><div class="slips" style="margin-top:22px"><h2>My mistakes</h2>'+mistakesHtml()+'</div></div></div>';
}
/* ---- level challenge ---- */
function vQuiz(){
  var L=G.lv;
  if(L.done){
    var sc=0;LV.forEach(function(q,i){if(L.ans[i]===q.a)sc++;});
    var miss=null;LV.forEach(function(q,i){if(miss===null&&L.ans[i]!==q.a)miss=q.t;});
    var msg=sc===3?"All three right. You are ready for the next chapter, or a longer test.":(miss?"Revisit "+TOPICS[miss].n+" next. The explanations below show where the steps went.":"");
    var rev=LV.map(function(q,i){var a=L.ans[i],ok=a===q.a;return '<div class="qrev"><span class="tagx '+(ok?'g':'m')+'">'+(ok?'Correct':(a===null?'Skipped':'Not quite'))+'</span> <small class="muted">'+TOPICS[q.t].n+'</small><div class="stem">'+q.stem+'</div><div class="muted" style="font-size:14px">Correct answer: '+q.o[q.a]+'.</div><div class="fbk nt" style="background:var(--brand-soft)">'+q.ex+'</div></div>';}).join("");
    return crumbs([cbtn("Home","home"),cbtn("Limits","hub"),"Level challenge"])+'<div class="hero" style="margin-bottom:16px"><div class="top"><div><div class="hi">Level challenge</div><div class="big">'+sc+' of 3 right</div><div class="sub">'+msg+'</div></div></div></div>'+
     '<div class="card"><h2>Review <span class="drafttag">Draft · pending academic review</span></h2>'+rev+'</div><div class="nbtn" style="margin-top:14px"><button class="btn primary sm" data-a="lvstart">Try again</button><button class="btn quiet sm" data-a="shell" data-v="hub">Back to the Limits hub</button><button class="btn quiet sm" data-a="shell" data-v="explore">Explore other chapters</button></div>'+foot();
  }
  var q=LV[L.qi],last=L.qi===LV.length-1;
  var opts=q.o.map(function(o,k){return '<button class="opt'+(L.ans[L.qi]===k?' sel':'')+'" data-a="lvpick" data-i="'+k+'"><span class="ol">'+"ABCD"[k]+'</span><span>'+o+'</span></button>';}).join("");
  return crumbs([cbtn("Home","home"),cbtn("Limits","hub"),"Level challenge"])+'<div class="tbar"><div><div class="ti">Limits · Level challenge <span class="drafttag">Draft</span></div><div class="sub">Three harder questions · practice only · pending academic review</div></div></div>'+
   '<div class="qprog" aria-hidden="true"><i style="width:'+Math.round(100*(L.qi+1)/LV.length)+'%"></i></div>'+
   '<div class="card narrow" style="margin-inline:0;max-width:760px"><div class="qhead"><span>Question '+(L.qi+1)+' of '+LV.length+'</span></div><div class="stem" aria-label="Question">'+q.stem+'</div><div class="opts" role="group" aria-label="Options">'+opts+'</div></div>'+
   '<div class="nbtn" style="margin-top:14px;max-width:760px"><button class="btn quiet" data-a="lvprev"'+(L.qi===0?' disabled':'')+'>Previous</button><button class="btn primary" data-a="lvnext">'+(last?'Finish':'Save and next')+'</button></div>'+foot();
}

/* ---- render ---- */
function renderShell(){
  stopTimers();clearInterval(mpT);mpT=null;G.mp.playing=false;
  var b;
  switch(G.view){
    case "hub":b=vHub();break;
    case "topic":b=vTopic();break;
    case "mylearn":b=vMy();break;
    case "practice":b=vPractice();break;
    case "index":b=vIndex();break;
    case "revision":b=vRevision();break;
    case "series":b=vSeries();break;
    case "quiz":b=vQuiz();break;
    default:b=vHome();
  }
  document.getElementById("root").innerHTML=header()+'<main class="shell">'+b+'</main>'+(G.lang?'':gate());
}
function jbanner(){
  var s='';
  if(G.entry==="youtube")s+='<div class="jb">You opened this from a Limits lesson on YouTube. The link named the language, so the test opened in <b>'+LNAME[G.lang||"en"]+'</b> with no language question.</div>';
  if(G.lang&&G.lang!=="en")s+='<div class="jb warn"><b>'+LNAME[G.lang]+'</b> content for this chapter is coming soon, so the English version is shown with this label. Switching language keeps your attempt. <button class="lk" data-a="setlang" data-l="en">Switch to English</button></div>';
  return s?'<div class="jbs">'+s+'</div>':'';
}
function mpStep(){
  var m=G.mp;if(!m.playing)return;
  m.p=Math.min(1,m.p+0.012);
  var s=tsStart(m.t),e=tsEnd(m.t),b=document.getElementById("mpbar"),tm=document.getElementById("mptm");
  if(b)b.style.width=Math.round(m.p*100)+"%";if(tm)tm.textContent=mmss(s+m.p*(e-s));
  if(m.p>=1){m.playing=false;clearInterval(mpT);var bt=document.querySelector(".mpl");if(bt)bt.innerHTML=I.play;}
}
function startTest(){
  S.test={list:Q,ans:Q.map(function(){return null;}),qi:0,t0:Date.now(),spent:0};
  S.rt={list:[],ans:[],qi:0};S.unlocked=false;S.plan=null;S.yt.playing=false;
  go("test");
}
function toView(v,opts){
  stopTimers();clearInterval(mpT);mpT=null;G.view=v;
  render();
  if(!opts||!opts.keep)window.scrollTo(0,0);
}
function shellAct(a,b){
  var d=b.dataset;
  switch(a){
    case "shell":
      if(d.v==="home"){G.entry="direct";setHash("#/home");toView("home");}
      else if(d.v==="explore"){G.entry="direct";toView("home",{keep:true});var c=document.getElementById("catalogue");if(c)c.scrollIntoView();}
      else if(d.v==="index"){setHash("#/index");toView("index");}
      else if(d.v==="mylearn"){G.my="overview";setHash("#/my/overview");toView("mylearn");}
      else if(d.v==="series"){setHash("#/test-series");toView("series");}
      else if(d.v==="hub"){G.chap="limits";setHash("#/chapter/limits");toView("hub");}
      return true;
    case "cat":G.cat=d.c;render();return true;
    case "tocats":var ce=document.getElementById("cats");if(ce)ce.scrollIntoView();return true;
    case "pcta":
      if(d.k==="freetest"){G.entry="direct";startTest();}
      else if(d.k==="pack"){go("pack");}
      else{toast("Demo: here we would take your number and notify you at launch. Nothing is saved.");}
      return true;
    case "setlang":G.lang=d.l;saveG();render();return true;
    case "chapter":G.chap=d.c;G.tab="learn";G.entry=G.entry==="youtube"?"direct":G.entry;setHash("#/chapter/"+d.c);toView("hub");return true;
    case "route":G.chap="limits";G.tab=d.v;toView("hub");return true;
    case "htab":G.tab=d.v;render();return true;
    case "topic":G.topic=d.t;setHash("#/topic/"+d.t);toView("topic");return true;
    case "takeTest":case "starttest":G.entry=(a==="takeTest")?"direct":G.entry;startTest();return true;
    case "startrt2":
      var wk=analyse().weak.slice(0,4);S.weak=wk;S.rt={list:wk.map(function(t){return RT[t];}),ans:wk.map(function(){return null;}),qi:0};go("retest");return true;
    case "journey":go(d.to);return true;
    case "cont":go(S.screen);return true;
    case "filt":G.f=d.f;renderCat();return true;
    case "clearsearch":G.q="";G.f="all";G.onlyLang=false;render();return true;
    case "bm":G.bm[d.t]=!G.bm[d.t];saveG();render();return true;
    case "idxresult":
      if(!tested()){startTest();for(var i=0;i<6;i++){S.test.ans[i]=(i%2?Q[i].a:0);}S.max=Math.max(S.max,2);}
      go("result");return true;
    case "mytab":G.my=d.v;setHash("#/my/"+d.v);if(G.view==="mylearn"){render();}else{toView("mylearn");}return true;
    case "practice":G.pt=d.t||G.pt;G.pl="std";setHash("#/practice/"+G.pt);toView("practice");return true;
    case "plevel":G.pl=d.v;render();return true;
    case "hpick":G.hp[d.t]=+d.i;render();return true;
    case "hreset":delete G.hp[d.t];render();return true;
    case "phint":G.ph[d.t+G.pl]=true;render();return true;
    case "revision":setHash("#/revision");toView("revision");return true;
    case "fcflip":G.fc.flip=!G.fc.flip;render();return true;
    case "fcgo":G.fc.i=(G.fc.i+ +d.d+ORDER.length)%ORDER.length;G.fc.flip=false;render();return true;
    case "prpick":G.pr[d.t]=+d.i;render();return true;
    case "prreset":delete G.pr[d.t];render();return true;
    case "mpplay":
      var m=G.mp;
      if(m.t!==d.t){m.t=d.t;m.p=0;}
      if(m.p>=1)m.p=0;
      m.playing=!m.playing;
      clearInterval(mpT);
      if(m.playing)mpT=setInterval(mpStep,100);
      b.innerHTML=m.playing?I.pause:I.play;
      return true;
    case "lvstart":G.lv={qi:0,ans:[null,null,null],done:false};toView("quiz");return true;
    case "lvpick":G.lv.ans[G.lv.qi]=+d.i;render();return true;
    case "lvprev":if(G.lv.qi>0)G.lv.qi--;render();return true;
    case "lvnext":if(G.lv.qi<LV.length-1){G.lv.qi++;render();}else{G.lv.done=true;render();window.scrollTo(0,0);}return true;
    case "entry":
      if(d.r==="youtube"){G.lang="hi";saveG();G.entry="youtube";setHash("#/yt/limits/diagnostic/hi");startTest();}
      else if(d.r==="visitor"){G.lang=null;saveG();G.entry="direct";setHash("#/home");toView("home");}
      else{G.entry="chapter";G.chap="limits";G.tab="test";setHash("#/chapter/limits/key");toView("hub");}
      return true;
  }
  return false;
}
document.addEventListener("change",function(e){
  var t=e.target,c=t.dataset&&t.dataset.ch;
  if(c==="lang"&&t.value){G.lang=t.value;saveG();render();}
  else if(c==="onlyl"){G.onlyLang=t.checked;renderCat();}
  else if(c==="note"){G.notes[t.dataset.t]=t.value;saveG();}
  else if(c==="plan"){G.plan[t.dataset.k]=t.checked;saveG();render();}
});
document.addEventListener("input",function(e){var t=e.target;if(t.dataset&&t.dataset.ch==="q"){G.q=t.value;renderCat();}});
function applyHash(){
  var h="";try{h=(location.hash||"").replace(/^#\/?/,"");}catch(e){}
  if(!h)return;
  var p=h.split("?")[0].split("/");
  if(p[0]==="yt"){
    var l=p[3]&&LNAME[p[3]]?p[3]:(G.lang||"en");G.lang=l;saveG();G.entry="youtube";startTest();
  }else if(p[0]==="chapter"){
    G.chap=p[1]||"limits";G.view="hub";if(p[2]==="key"){G.entry="chapter";G.tab="test";}render();
  }else if(p[0]==="test-series"){G.view="series";render();
  }else if(p[0]==="index"){G.view="index";render();
  }else if(p[0]==="my"){G.my=MYTABS.some(function(x){return x[0]===p[1];})?p[1]:"overview";G.view="mylearn";render();
  }else if(p[0]==="practice"){if(TOPICS[p[1]])G.pt=p[1];G.view="practice";render();
  }else if(p[0]==="revision"){G.view="revision";render();
  }else if(p[0]==="topic"&&TOPICS[p[1]]){G.topic=p[1];G.view="topic";render();}
}
window.addEventListener("hashchange",applyHash);
applyHash();

render();
})();
</script>
