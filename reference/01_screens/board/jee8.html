:root{--navy:#141B4D;--or:#FF6B35;--ori:#B93A0B;--line:#C9D3F0}
body{background:#ECEFF9;color:var(--navy)}
.row{gap:30px}.cell{width:390px}.cap b{background:var(--or);color:#fff}.subc{color:#4A5272}
.ph{width:390px;height:844px;border:1px solid var(--line);border-radius:22px;background:#F4F5FB;box-shadow:0 18px 40px -22px rgba(20,27,77,.45)}
.sb{display:none}
.hd{background:#fff;color:var(--navy);padding:12px 14px;border-bottom:1px solid var(--line);position:relative}
.hd:before{content:"";display:none}
.hd b{color:var(--navy);font-size:14.5px;font-weight:800}.hd small{color:#4A5272;opacity:1;font-size:11px}.bk{color:var(--navy)}
.xp{background:#FFF1E8;color:var(--ori);border:1px solid #FFD2BB}
.pg{border-bottom:1px solid var(--line)}.pt b{color:var(--ori)}
.bar{background:#E3E8F8}.bar i{background:var(--or)}
.foot{background:#F4F5FB}
.cta{background:var(--or);box-shadow:none;border-radius:11px;padding:14px;font-size:14px}.cta.pay{background:var(--or);box-shadow:0 8px 20px rgba(255,107,53,.38)}
.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line);border-radius:11px}
.idea{border-left:0;border:1px solid var(--line);border-radius:12px;background:#fff}.idea small,.card small{color:var(--ori)}
.mm{border-left:2px solid #DDE3F6}.nd:before{border-top:2px solid #DDE3F6}.nd{border:1px solid var(--line);border-radius:12px}.nd.on{border:2px solid var(--navy);background:#E8EBFA;box-shadow:5px 5px 0 var(--or)}.dot{background:var(--or)}.ch{color:var(--navy)}.chips span{background:#E8EBFA;color:var(--navy)}
.card{border:1px solid var(--line);border-radius:12px}
.sg span.on{background:var(--navy)}
.tr.on,.of.hot{border-color:var(--or)}
.chr,.tp,.rr{border:1px solid var(--line);border-radius:12px}
.op.right{border-color:#0E9F6E;background:#E8F7F0}.op.wrong{border-color:#E5484D;background:#FDECEC}
.op{border:1.5px solid var(--line);border-radius:12px;background:#fff}.op span{background:#fff;border:1.5px solid #8b93a6;color:var(--navy)}
