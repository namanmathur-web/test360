<!doctype html><meta charset=utf-8><style>
:root{--o:#C2410C;--o7:#7C2D0A;--o1:#F5DFCC;--o0:#FDF4EC;--ink:#14161A;--mu:#6B6F76;--bg:#FAF7F4;--v:#5B2BD9;--g:#D99A00;--l1:#B8892B;--l2:#3E9A6B;--l3:#4B7DB5;--l4:#B65A74;--l5:#5B6472;--t1:#F7EEDA;--t2:#E2F2E9;--t3:#E3ECF6;--t4:#F5E3E8;--t5:#E6E8EC}
*{box-sizing:border-box;margin:0}body{background:#E9E4DE;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;color:var(--ink);padding:24px;width:max-content}
.row{display:flex;gap:28px;margin-bottom:34px}.cell{width:390px}.cap{font-weight:800;font-size:15px;margin:0 0 4px}.cap b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--o);color:#fff;font-size:13px;margin-right:8px}.sub{font-size:12px;color:#5b5f66;margin:0 0 10px;height:32px}
.ph{width:390px;height:780px;background:var(--bg);border-radius:34px;border:8px solid #14161A;overflow:hidden;position:relative;display:flex;flex-direction:column}
.ph img.full{width:100%;height:100%;object-fit:cover;object-position:top}
.sb{height:26px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;padding:8px 20px 0}
.in{padding:10px 18px 18px;flex:1;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px}.top i{font-style:normal;color:var(--o)}
.xp{background:#FFF4CC;color:#8a5f00;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:800}
h1{font-size:25px;line-height:1.15;margin:14px 0 6px;letter-spacing:-.02em}h2{font-size:12px;letter-spacing:.1em;color:var(--mu);margin:16px 0 8px}p{font-size:13px;color:#44484f;line-height:1.5}
.hero{background:linear-gradient(339deg,#3B1305,#8F300E 52%,#DB7A33);color:#fff;border-radius:20px;padding:18px;margin-top:12px}.hero small{opacity:.8;font-size:10px;letter-spacing:.1em}.hero h3{font-size:19px;margin:6px 0 4px}.hero p{color:#fbe3d2}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:14px;background:var(--o);color:#fff;text-align:center;margin-top:12px}.btn.g{background:#fff;color:var(--ink);border:1.5px solid #E3DDD6}.btn.v{background:var(--v)}.btn.s{padding:9px;font-size:12px;margin-top:0;width:auto;display:inline-block;border-radius:10px}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs span{padding:8px 14px;border-radius:20px;border:1.5px solid #E3DDD6;font-weight:700;font-size:13px;background:#fff}.tabs .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:#fff;border:1px solid #EEE7E0;border-radius:16px;padding:12px 14px;margin-bottom:10px}.r1{display:flex;gap:12px;align-items:center}.tile{width:44px;height:44px;border-radius:13px;background:var(--o0);color:var(--o);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.card b{font-size:14px;display:block}.card small{font-size:11px;color:var(--mu)}.lad{display:flex;gap:4px;margin-top:8px}.lad i{flex:1;height:6px;border-radius:3px;background:#eee}.lad i.d{background:var(--c)}
.bar{height:8px;border-radius:5px;background:#EFE9E3;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--o)}
.chip{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:800}
.nt{background:#FFFDF6;background-image:repeating-linear-gradient(transparent 0 27px,#E7DFCB 27px 28px);font-family:Lora,Georgia,serif}.nt h1{font-family:Lora,Georgia,serif}
.slip{background:#F3E6F2;border-left:4px solid #7A3B6E;border-radius:6px;padding:10px;font-size:12.5px;margin-top:10px;color:#4b2444;font-family:Lora,Georgia,serif}
.sec{background:#fff;border:1px solid #E7DFCB;border-radius:12px;padding:11px 13px;margin-top:10px;font-family:Lora,Georgia,serif}.sec b{font-size:14px}.sec p{font-size:12.5px;margin-top:5px;font-family:Lora,Georgia,serif}.fm{background:#FFF4D6;border-radius:8px;padding:9px;margin-top:7px;font-size:13px;text-align:center}
.lv{display:flex;gap:5px;margin:6px 0}.lv span{flex:1;border-radius:11px;padding:9px 2px;text-align:center;font-weight:800;font-size:13px;background:var(--bt);color:var(--bc);border:1.5px solid transparent}.lv span.on{border-color:var(--bc);background:#fff}.lv small{display:block;font-size:9px;font-weight:600}
.tr{display:flex;align-items:center;gap:10px;padding:11px 12px;background:#fff;border:1.5px solid #EEE7E0;border-radius:14px;margin-bottom:8px;font-size:13px;font-weight:700}.tr.on{border-color:var(--o);background:var(--o0)}.tr .ck{width:20px;height:20px;border-radius:6px;border:2px solid #CFC7BE;display:grid;place-items:center;font-size:12px;color:#fff}.tr.on .ck{background:var(--o);border-color:var(--o)}
.stp{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:10px 14px;border:1px solid #EEE7E0;font-weight:700;font-size:13px}.stp b{font-size:20px;display:inline-block;min-width:28px;text-align:center}.stp span.pm{width:30px;height:30px;border-radius:9px;background:var(--o0);color:var(--o);display:inline-grid;place-items:center;font-size:18px}
.res{background:linear-gradient(339deg,#110A6A,#7A42B0);color:#fff;border-radius:20px;padding:16px;margin-top:10px}.res .big{font-size:42px;font-weight:800}.res .big span{font-size:16px;opacity:.7}.res small{opacity:.8}
.ved{font-weight:800;color:#CDB8FF}.ea{background:#fff;border:1px solid #E3DAF8;border-radius:14px;padding:10px 12px;margin-top:8px;font-size:12px}.ea .h{display:flex;justify-content:space-between;font-weight:800;font-size:13px}.ea .g{color:#1F7A44}
.dim{position:absolute;inset:0;background:rgba(20,16,40,.55);display:flex;align-items:flex-end}.sheet{background:#fff;border-radius:24px 24px 0 0;padding:18px;width:100%}.n{font-size:44px;font-weight:800;color:var(--v)}
.pl{border:1.5px solid #E7DFCB;background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;position:relative}.pl.hot{border-color:var(--v);box-shadow:0 0 0 3px #ECE5FB}.pl b{font-size:15px}.pl .pr{position:absolute;right:14px;top:12px;font-weight:800;font-size:17px}.pl ul{padding-left:16px;font-size:12px;margin-top:6px;color:#44484f;line-height:1.6}.tag{position:absolute;top:-9px;left:14px;background:var(--v);color:#fff;font-size:10px;font-weight:800;padding:2px 9px;border-radius:10px}
.vid{background:linear-gradient(135deg,#2a2e38,#4b5160);border-radius:14px;height:120px;display:grid;place-items:center;color:#fff;margin-top:8px;font-size:13px}.play{width:44px;height:44px;border-radius:50%;background:var(--o);display:grid;place-items:center;font-size:18px}
.cmp{display:flex;gap:10px;margin-top:10px}.cmp div{flex:1;background:#fff;border:1px solid #EEE7E0;border-radius:14px;padding:12px;text-align:center}.cmp b{font-size:26px;display:block}.cmp small{font-size:10px;color:var(--mu)}
.up{color:#1F7A44}.nxb{display:flex;gap:8px;margin-top:8px}.nxb div{flex:1;border-radius:14px;padding:12px;font-weight:800;font-size:13px}.nxb small{display:block;font-size:10px;letter-spacing:.08em;margin-bottom:3px}
.lock{opacity:.5}.sample{font-size:10px;color:var(--mu);margin-top:6px}
.tab{position:absolute;bottom:0;left:0;right:0;height:56px;background:#fff;border-top:1px solid #EEE7E0;display:flex;justify-content:space-around;align-items:center;font-size:10px;font-weight:700;color:var(--mu)}.tab .on{color:var(--o)}
.q{background:#fff;border:1.5px solid #E3DDD6;border-radius:12px;padding:12px;margin:8px 0;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center}.q i{width:20px;height:20px;border-radius:50%;border:2px solid #CFC7BE;flex:none}.q.s i{background:var(--o);border-color:var(--o)}.sol2{background:#FFFDF6;border:1px solid #E7DFCB;border-radius:12px;padding:12px;font-size:12.5px;margin-top:8px;font-family:Lora,Georgia,serif;line-height:1.6}.ta{font-size:11px;color:#7A3B6E;font-weight:700}.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.sg .card{margin:0;text-align:center;padding:14px 8px}.sg .tile{margin:0 auto 6px}.lg{display:inline-flex;gap:0;border:1.5px solid #E3DDD6;border-radius:16px;overflow:hidden;font-size:11px;font-weight:800}.lg span{padding:4px 8px;background:#fff}.lg .on{background:var(--ink);color:#fff}.chart{display:flex;align-items:flex-end;gap:10px;height:90px;margin-top:8px}.chart div{flex:1;border-radius:6px 6px 0 0;background:var(--o1);position:relative}.chart div.l{background:var(--o)}.chart span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:11px;font-weight:800}
</style><body>
<div class=row id=r1></div><div class=row id=r2></div><div class=row id=r3></div><div class=row id=r4></div><div class=row id=r5></div>
<script>
const SB='<div class=sb><span>9:41</span><span>●●● ▮</span></div>';
const F=(n,t,s,body,cls='')=>`<div class=cell><p class=cap><b>${n}</b>${t}</p><p class=sub>${s}</p><div class="ph ${cls}">${SB}${body}</div></div>`;
const tabbar=a=>`<div class=tab><span class="${a==0?'on':''}">◉<br>Tests</span><span class="${a==1?'on':''}">▤<br>Notes</span><span class="${a==2?'on':''}">↗<br>Progress</span><span>☺<br>Me</span></div>`;
const LG='<span class=lg><span class=on>EN</span><span>தமிழ்</span></span>';
const TB=`<div class=top><span><i>Vedantu</i> Test360</span><span style="display:flex;gap:6px;align-items:center">${LG}<span class=xp>★ 90 XP</span></span></div>`;
const BK=(t)=>`<div class=top><span style="color:var(--mu)">‹ ${t}</span><span style="display:flex;gap:6px;align-items:center">${LG}<span class=xp>★ 90 XP</span></span></div>`;
const lad=(d)=>`<div class=lad>${[1,2,3,4,5].map(l=>`<i class="${d.includes(l)?'d':''}" style="--c:var(--l${l})"></i>`).join('')}</div>`;
const SUB=[['Tamil','த'],['English','Aa'],['Maths','∫'],['Physics','⚛'],['Chemistry','⚗'],['Bio-Botany','❀'],['Bio-Zoology','🐾'],['Computer Science','&lt;/&gt;']];
const CH=['Applications of Matrices and Determinants','Complex Numbers','Theory of Equations','Inverse Trigonometric Functions','Two Dimensional Analytical Geometry','Applications of Vector Algebra','Applications of Differential Calculus','Differentials and Partial Derivatives','Applications of Integration','Ordinary Differential Equations','Probability Distributions','Discrete Mathematics'];
const SY=['∑','i','x³','sin⁻¹','◯','→','f′','∂','∫','dy','P','∧'];
const tp=[['Derivative as a rate of change',[1,2]],['Mean value theorems',[1]],['Increasing and decreasing functions',[]],['Maxima and minima',[]],['Concavity and inflection points',[]],['Curve sketching',[]]];
const s1=F(1,'TN 12th home','Own entry for Tamil Nadu State Board. One big action: free test. Language toggle in the header.',`<div class=in>${TB}<div class=hero><small>TAMIL NADU STATE BOARD · 12TH</small><h3>Free chapter tests for your Public Exam</h3><p>Read a short summary, test yourself, see what to fix.</p></div><div class=btn>Start free test</div><div class="btn g" style="margin-top:8px">Continue: Mean value theorems · Level 2</div><h2>TODAY’S MISSIONS · 1/3</h2><div class=card><div class=r1><span class=tile style="font-size:15px">✓</span><div style="flex:1"><b>Read 2 summary sections</b><small>1/2 · +10 XP</small></div></div></div><div class=card><div class=r1><span class=tile>🔥</span><div><b>3-day streak</b><small>Take a test today to make it 4</small></div></div></div></div>${tabbar(0)}`);
const s2=F(2,'Free tests: subjects','Every subject is open. Chapters are divided by subject, like Physics/Chemistry/Maths in JEE.',`<div class=in>${TB}<h1>Pick a subject</h1><p>All 8 subjects are open.</p><div class=sg>${SUB.map(x=>`<div class=card><span class=tile>${x[1]}</span><b>${x[0]}</b><small>Chapters · 5 levels</small></div>`).join('')}</div></div>${tabbar(0)}`);
const s3=F(3,'Maths: chapter page','Every chapter as a card with its own symbol and level ladder. Nothing locked.',`<div class=in>${BK('Subjects')}<h1>Maths chapters</h1><div style="overflow:hidden;height:600px">${CH.slice(0,7).map((c,i)=>`<div class=card><div class=r1><span class=tile style="font-size:15px">${SY[i]}</span><div><b>${c}</b><small>Free test · 5 levels</small></div></div>${lad(i==6?[1,2]:[])}</div>`).join('')}</div></div>${tabbar(0)}`);
const s4=F(4,'Chapter: topics','Journey path of topics inside Applications of Differential Calculus. Topic names are draft, teacher to confirm.',`<div class=in>${BK('Maths')}<div class=hero style="padding:14px"><small>12TH MATHS · CALCULUS</small><h3>Applications of Differential Calculus</h3><div class=bar style="background:#ffffff33"><i style="width:15%;background:#FFD66B"></i></div><p>15% done · 6 topics</p></div>${tp.map((t,i)=>`<div class=card style="margin:8px 0"><div class=r1><span class=tile style="${i==0?'background:var(--o);color:#fff':''}">${i+1}</span><div style="flex:1"><b>${t[0]}</b></div><span style="color:var(--o);font-weight:800;font-size:12px">${i==0?'Resume':'›'}</span></div>${lad(t[1])}</div>`).join('')}</div>`);
const s5=F(5,'Topic summary · short','Single tap on a section = short version. Same notes design as JEE. English notes with teacher’s Tamil hook inline.',`<div class="in nt"><div class=top style="font-family:inherit"><span style="color:var(--mu)">‹</span><span class=xp>★ 90</span></div><p style="font-size:10px;letter-spacing:.12em;margin-top:10px">12TH MATHS · TOPIC 2</p><h1>Mean value theorems</h1><p style="font-family:Lora,serif">If a curve is smooth between two points, somewhere in between the slope equals the average slope.</p><div class=sec><b>1 · Rolle’s theorem</b><p>Equal ends, so a flat tangent exists inside.</p><div class=btn style="margin-top:8px;padding:8px;font-size:12px;background:var(--o0);color:var(--o)">Full detail ›</div></div><div class=sec><b>2 · Lagrange’s theorem</b></div><div class=sec><b>3 · Checking the conditions</b></div><div class=sec><b>4 · The usual slip</b></div><div class=btn style="margin-top:14px">Test me on this</div></div>`);
const s6=F(6,'Topic summary · full detail','Double-tap or Full detail: formula, worked line, usual slip, Tamil hook. Got it gives XP.',`<div class="in nt"><div class=top style="font-family:inherit"><span style="color:var(--mu)">‹</span><span class=xp>★ 95</span></div><h1 style="font-size:21px">1 · Rolle’s theorem</h1><div class=sec><p>If f is continuous on [a, b], differentiable on (a, b) and f(a) = f(b), then f′(c) = 0 for some c in (a, b).</p><div class=fm>f′(c) = 0, a &lt; c &lt; b</div></div><div class=slip><b>Usual slip:</b> forgetting to check all three conditions before applying it.</div><div class=slip style="background:#E8F0FB;border-color:#4B7DB5;color:#24466f"><span class=ta>தமிழ் hook</span><br>Sample hook line from the teacher goes here.</div><div style="display:flex;gap:8px;margin-top:12px"><div class="btn s" style="background:#1F7A44;flex:1">✓ Got it +5 XP</div><div class="btn s g" style="flex:1">Review later</div></div></div>`);
const s7=F(7,'Pick topics & level','All 5 levels open. 3 questions per topic by default, adjustable.',`<div class=in>${BK('Chapter')}<h1>Build your test</h1><h2>TOPICS</h2>${tp.slice(0,3).map((t,i)=>`<div class="tr ${i<2?'on':''}"><span class=ck>${i<2?'✓':''}</span>${t[0]}</div>`).join('')}<h2>LEVEL</h2><div class=lv>${[1,2,3,4,5].map(l=>`<span class="${l==2?'on':''}" style="--bc:var(--l${l});--bt:var(--t${l})">${l}<small>${['Basic','Core','Mixed','Tough','Topper'][l-1]}</small></span>`).join('')}</div><h2>QUESTIONS PER TOPIC</h2><div class=stp><span class=pm>−</span><span><b>3</b> per topic</span><span class=pm>+</span></div><div class=btn>Start test · 6 questions</div><p style="text-align:center;margin-top:6px;font-size:11px">Earn up to +40 XP · Level 2 gives 1.2×</p></div>`);
const s8=F(8,'Test · instructions','Subjective test, same Eklavya-style shell. Sections by marks. Timer and marks are placeholders.',`<div class=in style="background:#fff"><h1 style="text-align:center;font-size:20px">Maths · Level 2</h1><h2 style="text-align:center">GENERAL INSTRUCTIONS</h2><p>• Total time: 30 minutes (placeholder).</p><p style="margin-top:8px">• 6 questions: 2-mark, 3-mark and 5-mark sections.</p><p style="margin-top:8px">• Write your answer in the box, or write on paper and upload a photo.</p><p style="margin-top:8px">• Step marks are shown in the solutions after you submit.</p><div class=btn>I am ready to begin</div></div>`);
const s9=F(9,'Test · question','Subjective question window: section tabs by marks, type or upload the answer. Sample question, labelled.',`<div class=in style="background:#F3F6F9"><div class=top style="font-size:14px"><span>Maths · Level 2</span><span>Time left 24:10</span></div><div style="display:flex;gap:6px;margin-top:10px"><span class=chip style="background:#2D5DA8;color:#fff">3 MARKS</span><span class=chip style="background:#fff">2 MARKS</span><span class=chip style="background:#fff">5 MARKS</span></div><p style="color:#2F55D4;font-weight:800;margin-top:12px;font-size:16px">Question No. 2 · 3 marks</p><p style="font-size:14px;margin-top:6px;color:var(--ink)">Find the slope of the tangent to the curve y = x² at x = 3. (Sample question)</p><div class=card style="margin-top:10px;height:150px;font-size:13px;color:var(--mu)">Type your answer here…</div><div class="btn g s" style="width:100%;margin-top:4px">📷 Upload a photo of your written answer</div><div style="display:flex;gap:8px;margin-top:12px"><div class="btn g s" style="flex:1;color:var(--o)">Mark for Review</div><div class="btn s" style="flex:1">Save &amp; Next</div></div></div>`);
const s10=F(10,'Test · exam summary & submit','Answered / not answered / marked counts, verification tick, Submit.',`<div class=in style="background:#fff"><h1 style="text-align:center;font-size:20px">Exam Summary</h1><div class=card style="background:#E4EEFC;margin-top:12px"><b>Maths</b><small>6 questions · Answered 5 · Not answered 1 · Marked 0</small></div><p style="margin-top:12px;font-size:12px">☐ I have verified my answers and wish to submit. I understand I cannot make changes after this.</p><div style="display:flex;gap:8px"><div class="btn g s" style="flex:1;margin-top:12px">Back</div><div class="btn s" style="flex:1;margin-top:12px">SUBMIT</div></div></div>`);
const s11=F(11,'Submitted','No detailed report for state boards, so this is a short reward moment: XP, badge, streak. Solutions open next.',`<div class=in>${TB}<div class=hero style="text-align:center;margin-top:30px"><div style="font-size:42px">✓</div><h3>Test submitted</h3><p>You answered 5 of 6. Solutions are ready.</p></div><div class="win card" style="background:#FFF4CC"><b>🏅 Badge: First Test</b><small>+30 XP · Level: Explorer</small></div><div class=card><div class=r1><span class=tile>🔥</span><div><b>4-day streak</b><small>Come back tomorrow to keep it</small></div></div></div><div class=btn>See solutions</div></div>`);
const s12=F(12,'Solutions list','Free model answers for every question, with the step-wise marking scheme.',`<div class=in>${BK('Test')}<h1 style="font-size:21px">Solutions</h1><p>Open each answer, tick the steps you wrote, and see your own marks.</p>${[['Q1','2 marks','Define a derivative'],['Q2','3 marks','Slope of tangent to y = x² at x = 3'],['Q3','3 marks','State Rolle’s theorem'],['Q4','5 marks','Maxima and minima of x³ − 3x'],['Q5','2 marks','Increasing function'],['Q6','5 marks','Curve sketching']].map(q=>`<div class=card><div class=r1><span class=tile style="font-size:14px">${q[0]}</span><div style="flex:1"><b>${q[2]}</b><small>${q[1]}</small></div><span style="color:var(--o);font-weight:800">›</span></div></div>`).join('')}</div>`);
